name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Type-check, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # package-lock.json is git-ignored in this repo, so install from package.json.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build the extension
        run: npm run build
